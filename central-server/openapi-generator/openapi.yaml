openapi: 3.1.0
info:
  title: Smart Attendance System API
  version: "1.0.0"
  description: This is the API documentation for the Smart Attendance System.
  # license:
  #   name: Apache 2.0
  #   url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://smartattendance.fastwebcm.local/api/v1
    description: Core Business Logic Endpoint

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid input

    Unauthorized:
      description: Unauthorized - Invalid or missing token

    NotFound:
      description: Resource not found

    InternalServerError:
      description: Internal server error

  schemas:
    UserType:
      type: string
      enum: [student, staff]

    UserStatus:
      type: string
      enum: [active, inactive, dismissed]

    BiometricEnrollmentStatus:
      type: string
      enum: [pending, completed]

    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          minLength: 6
        stayloggedin:
          type: boolean
      required:
        - username
        - password

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        accessToken:
          type: string
        user:
          type: object
          properties:
            id:
              type: integer
            role:
              type: string
            username:
              type: string
            email:
              type: string
    PaginationMeta:
      type: object
      required:
        - total_records
        - current_page
        - total_pages
        - limit
      properties:
        total_records:
          type: integer
          description: Total quantity of active users matching structural selection metrics.
          example: 142
        current_page:
          type: integer
          description: The currently pulled response page offset iteration.
          example: 1
        total_pages:
          type: integer
          description: Maximum aggregate count of dynamic pagination user slices available.
          example: 3
        limit:
          type: integer
          description: Total boundary count constraint cap assigned for user blocks.
          example: 50

    AttendanceLedgerData:
      type: object
      required:
        - calendarDates
        - exceptions
        - users
        - initialAttendanceSummary
      properties:
        calendarDates:
          type: array
          description: Dense array list charting explicit day configurations within targeted window frames.
          items:
            type: object
            properties:
              raw:
                type: string
                format: date
                example: "2026-05-20"
              label:
                type: string
                example: "May 20"
              isWeekend:
                type: boolean
                example: false
              dayName:
                type: string
                example: "Wed"
        exceptions:
          type: array
          description: Array of global infrastructure anomalies or holiday closures falling inside the matrix.
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                example: "2026-05-01"
              name:
                type: string
                example: "International Workers Day"
              type:
                type: string
                example: "public_holiday"
        users:
          type: array
          description: Page-sliced listing of physical user entities rendered downstream inside row tracks.
          items:
            type: object
            properties:
              id:
                type: integer
                example: 12
              name:
                type: string
                example: "Sarah Jenkins"
              role:
                type: string
                example: "Lead DevOps Engineer"
              avatarColor:
                type: string
                example: "bg-emerald-100"
        initialAttendanceSummary:
          type: array
          description: Intertwined chronological cross-reference card layout tracking user summary performance maps.
          items:
            type: object
            properties:
              employee_id:
                type: integer
                description: Maps explicitly back to the unique tracking user id.
                example: 12
              date:
                type: string
                format: date
                example: "2026-05-20"
              first_checkin:
                type: ["string", "null"]
                format: date-time
                example: "2026-05-20T09:12:00+01:00"
              last_checkout:
                type: ["string", "null"]
                format: date-time
                example: "2026-05-20T17:34:00+01:00"
              total_hours:
                type: number
                format: float
                example: 8.3
              checkin_status:
                type: string
                enum: [on_time, late, absent]
                example: "late"
              session_status:
                type: string
                enum: [active, completed, missed_checkout, no_show]
                example: "completed"
              derived_from_session:
                type: integer
                enum: [0, 1]
                example: 1
              variance:
                type: integer
                description: Lateness value deviation tracked directly in minutes.
                example: 12

    User:
      type: object
      required:
        - fname
        - lname
        - email
        - user_type
      properties:
        id:
          type: integer
        fname:
          type: string
          example: Ichami
        lname:
          type: string
          example: Brandon
        email:
          type: string
          example: brandon@example.com
        gender:
          type: string
          enum: [male, female]
        user_type:
          $ref: "#/components/schemas/UserType"
        status:
          $ref: "#/components/schemas/UserStatus"
        biometric_enrollment_status:
          $ref: "#/components/schemas/BiometricEnrollmentStatus"
        role_id:
          type: integer
          description: role id for privileged staff
        class_id:
          type: integer
          description: current class of the student
        regno:
          type: string
        username:
          type: string
        password:
          type: string

    UserCreate:
      allOf:
        - $ref: "#/components/schemas/User"

    UserResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          example: brandon@example.com
        gender:
          type: string
          enum: [male, female]
        status:
          $ref: "#/components/schemas/UserStatus"
        biometric_enrollment_status:
          $ref: "#/components/schemas/BiometricEnrollmentStatus"
        role:
          type: string
        class:
          type: string
        studentregno:
          type: string
        username:
          type: string

    StudentInput:
      type: object
      required: [id, sregnum, fname, lname, gender, cname]
      properties:
        id:
          type: integer
          description: The online database studentid.
          example: 1445
        sregnum:
          type: string
          description: Unique registration number.
          example: "STU-2026-A1B2"
        fname:
          type: string
          example: "John"
        lname:
          type: string
          example: "Doe"
        gender:
          type: string
          enum: [Male, Female, Other]
          example: "Male"
        cname:
          type: string
          description: The class name string.
          example: "Form 5 Science"

    StaffInput:
      type: object
      required: [id, tregnum, fname, lname]
      properties:
        id:
          type: integer
          description: The online database teacherid.
          example: 82
        tregnum:
          type: string
          description: Unique teacher registration number.
          example: "STF-2026-X8B2"
        fname:
          type: string
          example: "Jane"
        lname:
          type: string
          example: "Smith"
    SyncRequest:
      type: object
      properties:
        students:
          type: array
          items:
            $ref: "#/components/schemas/StudentInput"
        staff:
          type: array
          items:
            $ref: "#/components/schemas/StaffInput"
    SyncResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        studentIds:
          type: array
          description: List of student IDs successfully processed to be sent back to online ACK.
          items:
            type: integer
          example: [1445, 1446]
        staffIds:
          type: array
          description: List of teacher IDs successfully processed to be sent back to online ACK.
          items:
            type: integer
          example: [82]
    # Role Schema
    Role:
      type: object
      required:
        - role_name
      properties:
        role_name:
          type: string
          example: Admin
        description:
          type: string
          example: Admin user
    RoleResponse:
      allOf:
        - $ref: "#/components/schemas/Role"
        - type: object
          properties:
            id:
              type: integer
              example: 1

    # Branch schema
    Branch:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Buea Campus
        location:
          type: string
          example: "Buea, Cameroon"
        description:
          type: string
          example: "Main campus of the institution"
        status:
          type: string
          enum: [active, inactive]
    BranchResponse:
      allOf:
        - $ref: "#/components/schemas/Branch"
        - type: object
          properties:
            id:
              type: integer
              example: 1
            admin_id:
              type: array
              items:
                type: integer
              description: Branch admins
            date_created:
              type: string
              format: date-time
              example: "2026-01-30T00:00:00Z"

    # Group Schema
    Group:
      type: object
      required:
        - branch_id
        - grouptype_id
        - name
        - absence_threshold
      properties:
        branch_id:
          type: integer
          example: 1
        grouptype_id:
          type: integer
          example: 1
        name:
          type: string
          example: Class A
        expected_weekly_hours:
          type: integer
          example: 40
        absence_threshold:
          type: integer
          example: 3
        supervisors:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: integer

    GroupResponse:
      allOf:
        - $ref: "#/components/schemas/Group"
        - type: object
          properties:
            id:
              type: integer
              example: 1
            date_created:
              type: string
              format: date-time
              example: "2026-01-30T00:00:00Z"

    # Subgroup Schema
    Subgroup:
      type: object
      required:
        - group_id
        - name
        - absence_threshold
      properties:
        group_id:
          type: integer
          example: 1
        name:
          type: string
          example: Subgroup 1
        absence_threshold:
          type: integer
          example: 2
        created_by:
          type: integer
          example: 101

    SubgroupResponse:
      allOf:
        - $ref: "#/components/schemas/Subgroup"
        - type: object
          properties:
            id:
              type: integer
              example: 1
            date_created:
              type: string
              format: date-time
              example: "2026-01-30T00:00:00Z"

    # permission schema
    PermissionRequest:
      type: object
      properties:
        permissiontype_id:
          type: integer
        user_id:
          type: integer
        initiatedby:
          type: integer
          description: The admin or HR who initiated this permission
        reason:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          type: string
          enum: [pending, approved, rejected]
        additional_proof:
          type: string
          description: The stored file name (optional)
        requested_at:
          type: string
          format: date-time

    PermissionApproval:
      type: object
      properties:
        permission_id:
          type: integer
        approver_id:
          type: integer
        remark:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]

    # Annoucement schema
    Annoucement:
      type: object
      properties:
        name:
          type: string
        message:
          type: string
        start_datetime:
          type: string
          format: date-time
          description:
            The date, time the annoucement will be visible to its respective
            groups/subgroups - terminals
        end_datetime:
          type: string
          format: date-time
          description:
            The date, time the annoucement will be disappear to its respective
            groups/subgroups - terminals
        created_by:
          type: integer
          description: The admin who created the announcement

    AnnouncementResponse:
      allOf:
        - $ref: "#/components/schemas/Annoucement"
        - type: object
          properties:
            id:
              type: integer
              example: 1
            date_created:
              type: string
              format: date-time
              example: "2026-01-30T00:00:00Z"
    # Events schema
    Event:
      type: object
      properties:
        name:
          type: string
          example: PTA Meeting

        start_datetime:
          type: string
          format: date-time
          example: "2026-03-01T09:00:00Z"

        end_datetime:
          type: string
          format: date-time
          example: "2026-03-01T11:00:00Z"

        affects_attendance:
          type: string
          default: "1"

        handshake:
          type: string
          enum: ["1", "2"]
          default: 1
          description: |
            '1' = check-in only
            '2' = check-in and check-out

        created_by:
          type: integer
          description: "User who created the event, optional"

    EventCheckinCheckoutRange:
      type: object
      properties:
        checkin_start_datetime:
          type: string
          format: date-time
        checkin_end_datetime:
          type: string
          format: date-time
        checkout_start_datetime:
          type: ["string", "null"]
          format: date-time
        checkout_end_datetime:
          type: ["string", "null"]
          format: date-time

    EventAccessPolicy:
      description: groups/subgroups allowed to auth for this event and the auth mode(s)
      type: object
      properties:
        group_id:
          type: integer
        subgroup_id:
          type: integer
        auth_type_id:
          type: integer

    EventCreate:
      allOf:
        - $ref: "#/components/schemas/Event"
        - type: object
          required:
            - name
            - start_datetime
            - end_datetime
          properties:
            check_in_out_range:
              description: check-in/check-out range for this event
              type: array
              items:
                $ref: "#/components/schemas/EventCheckinCheckoutRange"
            access_policy:
              type: array
              items:
                $ref: "#/components/schemas/EventAccessPolicy"

    EventResponse:
      allOf:
        - $ref: "#/components/schemas/Event"
        - type: object
          properties:
            id:
              type: integer
            created_at:
              type: string
              format: date-time
            access_policy:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/EventAccessPolicy"
                  - type: object
                    properties:
                      id:
                        type: integer
                      group_name:
                        type: string
                      auth_type_name:
                        type: string
            checkin_checkout_ranges:
              allOf:
                - $ref: "#/components/schemas/EventCheckinCheckoutRange"
                - type: object
                  properties:
                    id:
                      type: integer

    #exceptions schemas
    Exception:
      type: object
      required:
        - title
        - exception_type
        - start_date
        - end_date
      properties:
        title:
          type: string
        exception_type:
          type: string
          enum:
            [
              "public_holiday",
              "company_event",
              "system_maintenance",
              "emergency_closure",
              "term_closure",
              "other",
            ]
        description:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        created_by:
          type: integer
          description: The admin who created the exception

    ExceptionUpsertRequest:
      allOf:
        - $ref: "#/components/schemas/Exception"
        - type: object
          required:
            - title
            - exception_type
            - start_date
            - end_date
          properties:
            id:
              type: integer
              description: Required for update, auto generated for create
    ExceptionResponse:
      allOf:
        - $ref: "#/components/schemas/ExceptionUpsertRequest"
        - type: object
          properties:
            created_by_name:
              type: string

    #terminal schema
    Terminal:
      type: object
      properties:
        id:
          type: ["integer", "null"]
        name:
          type: string
        activation_code:
          type: string
          description: Auto generated by the system
        branch_id:
          type: integer
        slug:
          type: string
        status:
          type: string
          enum: ["pending", "active", "revoked"]

    AuthTypes:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          enum: [face, fingerprint, card]

    TerminalCapabilities:
      description: This defines the type of auth supported by the terminal
      type: object
      required:
        - auth_type_id
        - auth_step
      properties:
        auth_type_id:
          type: integer
          description: reference to the terminal auth types
        auth_step:
          type: integer
    TerminalAccessPolicy:
      description: groups/subgroups allowed to auth at this terminal
      type: object
      properties:
        group_id:
          type: ["integer", "null"]
        subgroup_id:
          type: ["integer", "null"]
        auth_type_id:
          type: integer

    TerminalCreate:
      type: object
      properties:
        terminalDetails:
          allOf:
            - $ref: "#/components/schemas/Terminal"
            - type: object
              required:
                - name
                - branch_id
        authCapabilities:
          description: The supported auth types for this terminal
          type: array
          items:
            $ref: "#/components/schemas/TerminalCapabilities"
        authPolicies:
          type: array
          items:
            $ref: "#/components/schemas/TerminalAccessPolicy"

    TerminalUpsertResponse:
      allOf:
        - $ref: "#/components/schemas/Terminal"
        - type: object
          properties:
            success:
              type: boolean
            message:
              type: string
            activationCode:
              type: string
              description: Auto generated by the system

    TerminalFetchResponse:
      type: object
      required:
        - id
        - name
        - branch_id
        - branch
        - status
        - ip_address
        - last_heartbeat
        - health_status

      properties:
        id:
          type: integer
          example: 1

        name:
          type: string
          example: "Main Entrance Terminal"

        branch_id:
          type: integer
          example: 2

        slug:
          type: string
          example: "main-entrance-terminal"

        branch:
          type: string
          example: "Douala Main Branch"

        status:
          type: string
          enum: ["active", "inactive"]
          example: "active"

        ip_address:
          type: ["string", "null"]
          example: "192.168.1.20"

        last_heartbeat:
          type: ["string", "null"]
          format: date-time
          example: "2026-05-11T12:00:00Z"

        health_status:
          type: string
          example: "healthy"
        auth_capabilities:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/TerminalCapabilities"
              - type: object
                properties:
                  terminal_id:
                    type: integer
                  auth_type_name:
                    type: string
                    enum: [face, fingerprint, card]
        access_policy:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/TerminalAccessPolicy"
              - type: object
                properties:
                  id:
                    type: integer
                  terminal_id:
                    type: integer
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: ["string", "null"]
                  group_name:
                    type: string
                  auth_type_name:
                    type: string
                    enum: [face, fingerprint, card]
    ApiResponseTerminalList:
      type: object
      required:
        - success
        - data

      properties:
        success:
          type: boolean
          example: true

        data:
          type: array
          items:
            $ref: "#/components/schemas/TerminalFetchResponse"
    # Biometric schema
    BiometricFaceEnrollRequest:
      type: object
      required:
        - user_id
        - face_image
      properties:
        user_id:
          type: integer
        face_image:
          type: string
          format: byte
          description: Base64 encoded face image
    BiometricFaceEnrollResponse:
      type: object
      properties:
        message:
          type: string
        biometric_profile_id:
          type: integer
      required:
        - message
        - biometric_profile_id
    BiometricFaceVerifyRequest:
      type: object
      required:
        - terminal_id
        - face_image
      properties:
        terminal_id:
          type: integer
        face_image:
          type: string
          format: byte
    BiometricFaceVerifyResponse:
      type: object
      properties:
        matched:
          type: boolean
        user_id:
          type: ["integer", "null"]
        confidence_score:
          type: number
          format: float
        message:
          type: string
      required:
        - matched
    # terminal auth schema
    AttendanceStatus:
      type: object
      properties:
        name:
          type: string
          enum: ["present", "absent", "late", "on permission"]
    TerminalAuthSession:
      description: track progress throughout the auth sequence
      type: object
      properties:
        user_id:
          type: integer
        terminal_id:
          type: integer
        current_step:
          type: integer
          default: 1
          description: |
            Since most terminals are presummed to support atleast 2 auth types,
            the current step will help track the progress to ensure that the user completes all the terminal required auth types
            before there are dimmed to have completed an auth session( check-in or check-out)
        status:
          type: string
          enum: ["in_progress", "completed"]
          default: in_progress

    TerminalAuthLog:
      description:
        logs each auth attemp, ie record is created for each completed auth
        session
      type: object
      properties:
        user_id:
          type: integer
        terminal_id:
          type: integer
        attendance_context:
          type: string
          enum: ["daily", "event"]
        event_id:
          type: integer
        auth_type_id:
          type: integer

    TerminalAttendanceSession:
      description: |
        Represents attendance after auth successs
        ie upon successfull checkin and checkout for daily attendance
        or checkin and/or checkout for event attendance depending on the handshake
      type: object
      properties:
        user_id:
          type: integer
        terminal_id:
          type: integer
        attendance_context:
          type: string
          enum: ["daily", "event"]
        event_id:
          type: integer
        checkin_timestamp:
          type: string
          format: date-time
        checkout_timestamp:
          type: string
          format: date-time
        checkin_status:
          type: string
          enum: ["on time", "late"]
        checkout_status:
          type: string
          enum: ["on time", "early"]
        session_status:
          type: string
          enum: ["active", "completed", "missed checkout"]
          default: active
        sync_status:
          type: string
          enum: ["pending", "synced", "error"]
          default: pending

    TerminalAttendanceSummary:
      description: |
        Summary of the daily/event attendance, this is the record that get sync to the central db
        Was the user present, late or on permission for this day
      type: object
      properties:
        user_id:
          type: integer
        terminal_id:
          type: integer
        attendance_date:
          type: string
          format: date
        attendance_context:
          type: string
          enum: ["daily", "event"]
        event_id:
          type: integer
        first_checkin:
          type: string
          format: date-time
        last_checkout:
          type: string
          format: date-time
        total_hours:
          type: integer
          description: Time difference in int btn last checkout and first checkin
        attendance_status:
          type: integer
        derived_from_session:
          type: boolean
          description:
            useful when the user is on a permission, so we do not have to
            compute the attendance session to arive to get the summary

    TerminalAuthCreate:
      allOf:
        - $ref: "#/components/schemas/TerminalAuthSession"
        - type: object
          required:
            - user_id
            - terminal_id
          properties:
            terminal_auth_log:
              allOf:
                - $ref: "#/components/schemas/TerminalAuthLog"
                - type: object
                  required:
                    - attendance_context
                    - auth_type_id
    TerminalAuthInProgressResponse:
      type: object
      properties:
        status:
          type: string
          enum: ["in_progress"]
        current_step:
          type: integer
          example: 1
        next_auth_type_id:
          type: integer
          example: 2
      required:
        - status
        - current_step
        - next_auth_type_id

    TerminalAuthCompletedResponse:
      type: object
      properties:
        status:
          type: string
          enum: ["completed"]
        message:
          type: string
        attendance_session:
          $ref: "#/components/schemas/TerminalAttendanceSession"
      required:
        - status
        - attendance_session

    TerminalAttendanceSummaryCreate:
      allOf:
        - $ref: "#/components/schemas/TerminalAttendanceSummary"
        - type: object
          required:
            - user_id
            - terminal_id
            - attendance_date
            - attendance_context
            - attendance_status

    # logs schema
    Logs:
      type: object
      properties:
        category:
          type: string
        description:
