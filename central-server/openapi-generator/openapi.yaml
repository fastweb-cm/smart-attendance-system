  /api/v1/terminal/slug/{slug}:
    get:
      operationId: getTerminalBySlug
      summary: Get terminal details by slug
      tags: [Terminals]
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Terminal details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalCreate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/terminals/auth:
    post:
      operationId: terminalAuth
      summary: Authenticate at a terminal
      tags: [Terminals Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalAuthCreate"
      responses:
        "200":
          # now the response needs to be two, the case where the current step is not equal terminal required auth types, then we just return the current step and the next auth type to complete, but if the current step is equal to the terminal required auth types, then we create the attendance session under the hood and return success message with the attendance session details
          description:
            Authentication successful, if there are more auth types to
            complete, the response will indicate
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TerminalAuthInProgressResponse"
                  - $ref: "#/components/schemas/TerminalAuthCompletedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/attendance/ledger:
    get:
      operationId: getAttendanceLedger
      summary: Retrieve the dense matrix attendance ledger grid
      description: Returns a paginated matrix of users alongside dense day-by-day attendance profiles, system exceptions, and column metadata matching the date filters.
      tags:
        - Attendance
      parameters:
        - in: query
          name: start_date
          required: false
          schema:
            type: string
            format: date
          description: Filter range starting date (YYYY-MM-DD). Defaults to 4 days ago from today.
          example: "2026-05-16"
        - in: query
          name: end_date
          required: false
          schema:
            type: string
            format: date
          description: Filter range ending date (YYYY-MM-DD). Defaults to the current date.
          example: "2026-05-20"
        - in: query
          name: status
          required: false
          schema:
            type: string
          description: Optional filter matching specific core attendance summary log status profiles.
          example: "late"
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: The horizontal page index slice targeted for active users pagination chunks.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: Total horizontal record count bounds limit of users isolated to return per request page.
        - in: query
          name: context
          required: false
          schema:
            type: string
            enum: ["daily", "event"]
            default: "daily"
          description: Attendance context filter daily or event default is daily",
      responses:
        "200":
          description: Attendance matrix dataset generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/AttendanceLedgerData"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/attendance/sync:
    post:
      operationId: syncAttendanceSummary
      summary: Sync attendance summary to central database
      tags: [Attendance Sync]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/TerminalAttendanceSummaryCreate"
      responses:
        "200":
          description: Attendance summary synced
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "Attendance summary synced successfully"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "Some records failed to sync"
                      failed_records:
                        type: array
                        items:
                          type: object
                          properties:
                            user_id:
                              type: integer
                            terminal_id:
                              type: integer
                            attendance_date:
                              type: string
                              format: date
                            attendance_context:
                              type: string
                            attendance_status:
                              type: integer
                            error_message:
                              type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

