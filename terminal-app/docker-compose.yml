services:
  # Local Database for the Terminal
  db:
    image: mysql:8.0
    container_name: db_terminal
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_terminal
      MYSQL_ROOT_PASSWORD: Password@2025
    ports:
      - "3308:3306" # Mapped to 3308 so it doesn't clash if you have MySQL on your PC
    volumes:
      - terminal_data:/var/lib/mysql
      # This line below allows you to run a script to create tables automatically on start
      - ./api/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Python Logic
  terminal-api:
    build: ./api
    dns:
      - 8.8.8.8
      - 1.1.1.1
    container_name: terminal-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8085:8000"
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
    environment:
      - CUDA_VISIBLE_DEVICES=-1 # <--- FORCE TENSORFLOW TO USE CPU
      - TF_CPP_MIN_LOG_LEVEL=2 # <--- SUPPRESS TENSORFLOW WARNINGS
      - DEEPFACE_HOME=/app/.deepface # <--- EXPLICIT DEEPFACE LOCATION
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=Password@2025
      - DB_NAME=db_terminal
      - ADMIN_API_URL=http://localhost:8087/api/v1 # The Central Admin IP
      - CENTRAL_API_URL=http://smartattendance.fastwebcm.local/api/v1

    device_cgroup_rules:
      - "c 189:* rmw" # allow any USB device node (major 189), including ones created later
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ./api:/app # <--- Syncs your local code instantly!
      # - ./api/sync_config.json:/app/sync_config.json
      # - ./api/.env:/app/.env
      - deepface_weights:/app/.deepface
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload # <--- Enables live reloading
    extra_hosts:
      - "smartattendance.fastwebcm.local:host-gateway"

  # Next.js Frontend (Development Mode with Hot-Reloading)
  terminal-ui:
    build:
      context: ./terminal-frontend
      target: development # <--- Targets the hot-reloading dev container
      args:
        - NEXT_PUBLIC_LOCAL_SERVICE_URL=http://localhost:8085
        - NEXT_PUBLIC_CENTRAL_API_URL=https://api.smartattendance.fastwebcm.org/api/v1
    container_name: terminal-ui
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=Password@2025
      - DB_NAME=db_terminal
      - TERMINAL_CONFIG_DIR=/app/terminal-configs
    volumes:
      - ./terminal-frontend:/app # <--- Syncs live code changes instantly
      - /app/node_modules # <--- Prevents host node_modules clash
      - /app/.next # <--- Prevents container build cache clash
      - ./terminal-frontend/terminal-configs:/app/terminal-configs
    depends_on:
      db:
        condition: service_healthy

  #phpmyadmin (MySQL web-base GUI)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: terminal-phpmyadmin
    restart: unless-stopped
    ports:
      - "8086:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

volumes:
  terminal_data:
  deepface_weights:
