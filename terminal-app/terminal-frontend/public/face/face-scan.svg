<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Biometric face alignment</title>
  <desc id="d">A person looking into a webcam inside a rounded alignment frame with a blue scanning line.</desc>

  <defs>
    <linearGradient id="scan-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E6FD9" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#1E6FD9" stop-opacity="1"/>
      <stop offset="0.8" stop-color="#1E6FD9" stop-opacity="1"/>
      <stop offset="1" stop-color="#1E6FD9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E6FD9" stop-opacity="0"/>
      <stop offset="1" stop-color="#1E6FD9" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="frame-clip">
      <rect x="180" y="130" width="440" height="560" rx="48"/>
    </clipPath>
  </defs>

  <style>
    :root { --blue:#1E6FD9; --blue-soft:#8FB8EE; --slate:#475569; --slate-light:#94A3B8; --skin:#5A3825; --skin-shade:#4A2D1D; --hair:#1B1D24; }
    #scan-line { animation: scan 3.2s ease-in-out infinite alternate; transform-box: fill-box; }
    #status-dot { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(330px); } }
    @keyframes pulse { 0%,100% { opacity:1; transform:scale(1);} 50% { opacity:.45; transform:scale(.8);} }
    @media (prefers-reduced-motion: reduce) { #scan-line, #status-dot { animation: none; } }
  </style>

  <!-- Background -->
  <rect id="background" width="800" height="800" fill="#FFFFFF"/>

  <!-- Guide frame -->
  <g id="guide-frame" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- webcam icon -->
    <g id="webcam-icon">
      <circle cx="400" cy="92" r="20" fill="#F1F5F9" stroke="#475569" stroke-width="4"/>
      <circle cx="400" cy="92" r="9" fill="#475569"/>
      <circle cx="404" cy="88" r="2.5" fill="#FFFFFF"/>
      <path d="M392 120 h16" stroke="#94A3B8" stroke-width="4"/>
    </g>
    <!-- faint full frame -->
    <rect x="180" y="130" width="440" height="560" rx="48" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="3 9"/>
    <!-- corner brackets -->
    <g id="corner-brackets" stroke="#1E6FD9" stroke-width="8">
      <path d="M180 208 V178 a48 48 0 0 1 48 -48 H258"/>
      <path d="M542 130 H572 a48 48 0 0 1 48 48 V208"/>
      <path d="M620 612 V642 a48 48 0 0 1 -48 48 H542"/>
      <path d="M258 690 H228 a48 48 0 0 1 -48 -48 V612"/>
    </g>
    <!-- alignment arcs -->
    <g id="alignment-arcs" stroke="#8FB8EE" stroke-width="5" opacity="0.9">
      <path d="M262 300 A150 190 0 0 0 262 480"/>
      <path d="M538 300 A150 190 0 0 1 538 480"/>
      <path d="M330 196 A110 40 0 0 1 470 196" stroke-dasharray="2 12"/>
    </g>
  </g>

  <!-- Face subject -->
  <g id="face-subject" clip-path="url(#frame-clip)">
    <!-- shoulders / clothing -->
    <path id="shoulders" d="M170 700 C170 600 250 556 330 546 L470 546 C550 556 630 600 630 700 Z" fill="#64748B"/>
    <path id="collar" d="M350 546 L400 612 L450 546 Z" fill="#475569"/>
    <!-- neck -->
    <path id="neck" d="M350 480 V548 Q400 596 450 548 V480 Z" fill="#4A2D1D"/>
    <!-- ears -->
    <ellipse id="ear-left" cx="290" cy="392" rx="16" ry="30" fill="#5A3825"/>
    <ellipse id="ear-right" cx="510" cy="392" rx="16" ry="30" fill="#5A3825"/>
    <!-- head -->
    <path id="head" d="M400 252 C340 252 296 296 296 370 C296 450 340 512 400 512 C460 512 504 450 504 370 C504 296 460 252 400 252 Z" fill="#6B4430"/>
    <!-- hair -->
    <path id="hair" d="M292 366 C282 280 330 226 400 226 C470 226 518 280 508 366 C500 330 486 306 462 292 C430 304 370 304 338 292 C314 306 300 330 292 366 Z" fill="#1B1D24"/>
    <!-- brows -->
    <g id="brows" stroke="#1B1D24" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M340 354 Q362 344 382 352"/>
      <path d="M418 352 Q438 344 460 354"/>
    </g>
    <!-- eyes -->
    <g id="eyes">
      <ellipse cx="362" cy="380" rx="15" ry="9" fill="#FFFFFF"/>
      <ellipse cx="438" cy="380" rx="15" ry="9" fill="#FFFFFF"/>
      <circle cx="362" cy="380" r="7" fill="#1B1D24"/>
      <circle cx="438" cy="380" r="7" fill="#1B1D24"/>
      <circle cx="364" cy="378" r="2" fill="#FFFFFF"/>
      <circle cx="440" cy="378" r="2" fill="#FFFFFF"/>
    </g>
    <!-- nose -->
    <path id="nose" d="M400 392 V428 Q386 440 380 436 M400 428 Q414 440 420 436" fill="none" stroke="#4A2D1D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- mouth -->
    <path id="mouth" d="M372 468 Q400 482 428 468" fill="none" stroke="#3A2116" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Scan line -->
  <g id="scan-line" clip-path="url(#frame-clip)">
    <rect x="180" y="190" width="440" height="60" fill="url(#scan-glow)"/>
    <rect x="190" y="248" width="420" height="4" rx="2" fill="url(#scan-grad)"/>
    <!-- reticle ticks -->
    <g stroke="#1E6FD9" stroke-width="4" stroke-linecap="round">
      <path d="M200 250 h18"/>
      <path d="M582 250 h18"/>
    </g>
    <circle cx="400" cy="250" r="7" fill="#FFFFFF" stroke="#1E6FD9" stroke-width="4"/>
  </g>

  <!-- Status indicator -->
  <g id="status-indicator">
    <rect x="300" y="722" width="200" height="40" rx="20" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
    <circle id="status-dot" cx="328" cy="742" r="7" fill="#1E6FD9"/>
    <rect x="346" y="737" width="96" height="10" rx="5" fill="#94A3B8"/>
    <rect x="450" y="737" width="28" height="10" rx="5" fill="#CBD5E1"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
