<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="Step 3: right" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
.ring2{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out .4s infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.approach{transform-box:fill-box;transform-origin:50% 0;animation:approach 3.6s cubic-bezier(.22,.61,.36,1) infinite}
@keyframes approach{
  0%{transform:translateY(190px) scale(1);opacity:0}
  6%{opacity:1}
  38%{transform:translateY(0) scale(1);opacity:1}
  46%{transform:translateY(0) scale(.97)}
  54%{transform:translateY(0) scale(1)}
  76%{transform:translateY(0) scale(1);opacity:1}
  94%{transform:translateY(190px) scale(1);opacity:0}
  100%{transform:translateY(190px);opacity:0}
}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 3.6s ease-out infinite}
@keyframes pop{
  0%,38%{transform:scale(0);opacity:0}
  48%{transform:scale(1.15);opacity:1}
  54%{transform:scale(1);opacity:1}
  76%{transform:scale(1);opacity:1}
  90%,100%{transform:scale(1);opacity:0}
}
@media (prefers-reduced-motion:reduce){.ring,.ring2,.approach,.pop{animation:none}}
</style>
<defs>
<linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#94a3b8"/></linearGradient>
<linearGradient id="skin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a2e20"/><stop offset=".5" stop-color="#6b4331"/><stop offset="1" stop-color="#4a2e20"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3b82f6" stop-opacity=".55"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
</defs>
<rect width="400" height="520" fill="#ffffff"/>
<g id="scanner">
  <rect x="100" y="30" width="200" height="420" rx="26" fill="url(#bezel)" stroke="#64748b" stroke-width="3"/>
  <circle cx="200" cy="80" r="15" fill="none" stroke="#475569" stroke-width="5"/>
  <rect x="184" y="108" width="32" height="18" rx="2" fill="#2563eb"/>
  <rect x="122" y="170" width="156" height="250" rx="64" fill="#1e293b"/>
  <ellipse cx="200" cy="300" rx="62" ry="82" fill="url(#glow)"/>
  <ellipse class="ring" id="ring" cx="200" cy="300" rx="46" ry="66" fill="none" stroke="#3b82f6" stroke-width="7"/>
  <ellipse class="ring2" id="ring2" cx="200" cy="300" rx="58" ry="78" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".6"/>
</g>
<g id="finger" transform="translate(30 0) rotate(9 200 265)">
  <g class="approach">
    <path d="M164 540 V301 a36 36 0 0 1 72 0 V540 Z" fill="url(#skin)"/>
    <rect x="177" y="275" width="46" height="36" rx="18" fill="#c9a28c" opacity=".85"/>
  </g>
</g>

</svg>
